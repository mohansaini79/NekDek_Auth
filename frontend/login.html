<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – NekDek Auth</title>
  <meta name="description" content="Sign in to your NekDek account securely.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-bg-grid"></div>

  <div class="page-wrap">
    <div class="card">

      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <span class="brand-name">NekDek Auth</span>
      </div>

      <h1 class="card-title">Welcome back</h1>
      <p class="card-sub">Enter your credentials to access your account.</p>

      <div id="alert" class="alert" role="alert"></div>

      <form id="form" novalidate>
        <div class="field">
          <div class="field-label"><span>Email Address</span></div>
          <div class="input-group">
            <i class="icon-left fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <span>Password</span>
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="input-group">
            <i class="icon-left fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="btn-eye" id="pw-eye" aria-label="Toggle password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top:4px;">
          <span class="btn-label">Sign In</span>
          <div class="spin"></div>
        </button>
      </form>

      <hr class="divider">
      <p class="help-text">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
