<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password – NekDek Auth</title>
  <meta name="description" content="Set a new strong password for your NekDek account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-bg-grid"></div>

  <div class="page-wrap">
    <div class="card">

      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <span class="brand-name">NekDek Auth</span>
      </div>

      <div style="text-align:center;margin-bottom:20px;">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.2);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <i class="fa-solid fa-lock" style="font-size:22px;color:var(--primary-h);"></i>
        </div>
        <h1 class="card-title" style="text-align:center;">Set new password</h1>
        <p class="card-sub" style="text-align:center;">Choose a strong password that meets all the requirements below.</p>
      </div>

      <div id="alert" class="alert" role="alert"></div>

      <form id="form" novalidate>
        <div class="field">
          <div class="field-label"><span>New Password</span></div>
          <div class="input-group">
            <i class="icon-left fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" required>
            <button type="button" class="btn-eye" id="pw-eye" aria-label="Toggle password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="strength-wrap" id="strength-wrap">
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="strength-hints" id="strength-hints">
              <div class="hint-item" id="h-len"><i class="fa-solid fa-circle-dot"></i>8+ characters</div>
              <div class="hint-item" id="h-upper"><i class="fa-solid fa-circle-dot"></i>Uppercase letter</div>
              <div class="hint-item" id="h-lower"><i class="fa-solid fa-circle-dot"></i>Lowercase letter</div>
              <div class="hint-item" id="h-number"><i class="fa-solid fa-circle-dot"></i>Number (0–9)</div>
              <div class="hint-item" id="h-special"><i class="fa-solid fa-circle-dot"></i>Special char (@$!%*?&amp;)</div>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="field-label"><span>Confirm New Password</span></div>
          <div class="input-group">
            <i class="icon-left fa-solid fa-lock"></i>
            <input type="password" id="confirm" placeholder="Re-enter your new password" autocomplete="new-password" required>
            <button type="button" class="btn-eye" id="cf-eye" aria-label="Toggle confirm password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top:4px;">
          <span class="btn-label">Update Password</span>
          <div class="spin"></div>
        </button>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
